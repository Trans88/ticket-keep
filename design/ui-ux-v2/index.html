/* Pro v2.1: aligned comparison and independent purchase area. */
.pro-screen{overflow-x:hidden;padding-bottom:18px}
.pro-account{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin:0 0 13px;flex-wrap:wrap}
.pro-account-dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.pro-account-caption{margin-left:auto}
.pro-banner{background:#285A45;color:#F7FAEF;border-radius:20px;padding:20px;margin-bottom:18px}

.pro-banner-badge svg{width:15px;height:15px}
.pro-section-heading h3{font-size:16px;line-height:1.5}
.pro-section-heading p{font-size:12px;color:var(--muted);line-height:1.8;margin:4px 0 12px}
.pro-comparison{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.pro-comparison table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px;line-height:1.6}
.pro-comparison th,.pro-comparison td{padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:break-word}
.pro-comparison thead th{font-weight:600;text-align:center}
.pro-comparison thead th:first-child,.pro-comparison tbody th{text-align:left}
.pro-comparison tbody th{font-weight:500}
.pro-comparison td{text-align:center;color:var(--ink)}
.pro-comparison small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:3px}
.pro-comparison .pro-column{background:var(--soft);color:var(--primary);font-weight:650}
.pro-comparison .pro-unlimited{font-size:15px}
.pro-comparison .pro-unavailable{color:var(--muted)}
.pro-comparison tr:last-child>*{border-bottom:0}
.pro-included{padding:15px 2px 7px}
.pro-included h3{font-size:12px;display:flex;align-items:center;gap:6px;font-weight:600}
.pro-included h3 svg{width:16px;height:16px;color:var(--primary)}
.pro-included p,.pro-terms{font-size:11px;line-height:1.85;color:var(--muted);margin-top:6px}
.pro-footer{padding:12px 20px 20px}
.pro-purchase-title{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;margin-bottom:9px}
.pro-purchase-title svg{width:18px;height:18px;color:var(--primary)}
.pro-footer-note{font-size:10px;line-height:1.7;text-align:center;margin-top:7px;color:var(--muted)}
.pro-footer-links{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted)}
.pro-footer-links .link{font-size:11px;min-height:44px;padding:8px 0}
.dark .pro-banner{background:#344934}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

function home(){let first=state.scenario==='empty', rows=first?[]:filtered(), soon=tickets.filter(t=>t.status==='soon').length;return `<div class="screen"><header class="top"><div><h2>票证记<span style="color:var(--primary)">.</span></h2><p>重要的凭证，好好收着。</p></div><button class="iconbtn quiet" data-action="reminders" aria-label="保修提醒">${icon('bell')}</button></header>${!first?`<section class="hero"><div class="circle-art"></div><div class="mini-ticket">${icon('shield')}</div><div class="eyebrow">WARRANTY NOTES</div><h3>${soon?'有 '+soon+' 张票证，<br>保修快到期了。':'票证已收好，<br>最近没有临期保修。'}</h3><p>已收好 ${tickets.length} 张票证</p><button class="hero-action" data-action="soon">${soon?'查看 30 天内到期':'查看全部票证'}${icon('arrow')}</button></section>`:''}<div class="search"><label class="searchbox">${icon('search')}<input id="search" aria-label="搜索商家或备注" placeholder="搜索商家、备注" value="${esc(state.query)}"></label><button class="iconbtn quiet" data-action="filters" aria-label="筛选票证">${icon('filter')}</button></div><div class="filters">${[['all','全部'],['soon','即将到期'],['active','未过期'],['none','未设保修']].map(([v,l])=>`<button class="chip ${state.filter===v?'active':''}" data-filter="${v}" aria-pressed="${state.filter===v}">${l}</button>`).join('')}</div><div class="section-head"><h3>${state.query?'搜索结果':state.filter==='all'?'最近收好':'筛选结果'}</h3><small>${first?0:rows.length} 张 · 最近添加</small></div><div id="list-results" class="tickets">${rows.length?rows.map(ticketRow).join(''):emptyContent(first)}</div>${rows.length?`<p class="footnote">${icon('lock').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px"')} 票证保存在本机，备份由你决定</p>`:''}</div>${bottom('home')}`}

tate.editExisting?'':esc(t.note)}"></label></form>${!manual?`<details class="disclosure"><summary>识别原文与重新识别</summary><p>原始识别内容仅供核对；重新识别前确认是否保留手动修改。</p><button class="link" data-action="reocr">重新识别这张票据</button></details>`:''}<div id="edit-error" class="proto-error" role="alert"></div></div><div class="footer-action"><button class="primary" data-action="save">${icon('check')}保存票证</button></div>`}

function pro(){

function render(){if(board){renderBoard();return}const n=notes[state.page];$('#app').innerHTML=`<div class="studio"><aside class="left"><div class="brand"><span class="brandmark">${icon('ticket')}</span>票证记<span style="font-size:10px;font-weight:400;color:var(--muted)">DESIGN V2</span></div><h1>生活凭证，<br>好好收着。</h1><p class="intro">暖白、森林绿、清晰的留白。<br>一套围绕“收好、找到、用上”<br>重新组织的移动端体验。</p><nav class="routes" aria-label="设计页面">${pages.map(([p,no,l])=>`<button class="${state.page===p?'active':''}" data-go="${p}"><span>${no}</span>${l}</button>`).join('')}</nav><div class="version">设计基线 / 390 × 844<br>Jetpack Compose / Android<br>2026.09 · 基于当前代码梳理</div><a class="design-link" href="?view=board">打开六屏设计总览 ↗</a><a class="design-link" href="GORK_IMPLEMENTATION.md">查看实现任务书 ↗</a></aside><main class="center"><div class="toolbar"><select class="tool" id="channel" aria-label="发行渠道"><option value="china" ${state.channel==='china'?'selected':''}>国内渠道 · 当前能力</option><option value="play" ${state.channel==='play'?'selected':''}>Play · Pro 入口</option></select><select class="tool" id="scenario" aria-label="演示状态"><option value="normal" ${state.scenario==='normal'?'selected':''}>正常状态</option><option value="empty" ${state.scenario==='empty'?'selected':''}>首次使用 / 空票证册</option><option value="manual" ${state.scenario==='manual'?'selected':''}>手动录入 / 无图片</option></select>${state.page==='pro'?`<select class="tool" id="member-state" aria-label="会员演示状态"><option value="free" ${!state.proMember?'selected':''}>普通用户</option><option value="pro" ${state.proMember?'selected':''}>已开通 Pro</option></select>`:''}<button class="tool" data-action="theme">${state.dark?'浅色':'深色'}</button></div>${phone(state.page)}<p class="preview-label">可点击设计原型 · 所有数据均为示例<br>不拍照、不上传、不付款；刷新后恢复演示数据</p></main><aside class="right"><div class="eyebrow">DESIGN INTENT / ${pages.find(p=>p[0]===state.page)[1]}</div><h2>${n[0]}</h2><p>${n[1]}</p>${[2,4,6].map(i=>`<div class="annotation"><strong>${n[i]}</strong><p>${n[i+1]}</p></div>`).join('')} function renderBoard(){const before={...state};state.channel='play';state.logged=true;state.scenario='normal';state.filter='all';state.query='';$('#app').innerHTML=`<div class="board"><header class="board-header"><div><div class="eyebrow">TICKETKEEP / UI & UX DIRECTION 02</div><h1>票证记，好好收着。</h1><p class="notice">六屏设计总览 · 预览含 Play 会员入口，国内渠道差异见交互原型</p></div><div class="board-controls"><a href="?" class="tool">进入交互原型 ↗</a><button class="tool" data-action="theme">切换深浅色</button></div></header><div class="board-grid">${pages.map(([p,no,l])=>`<section class="board-item"><h2><span class="muted">${no}</span>${l}</h2><a href="?screen=${p}" aria-label="打开${l}交互原型">${phone(p,'board-'+p)}</a></section>`).join('')}</div><p class="board-note">示例数据 / 基准日 2026.09.19。总览用于比对视觉；各页面的点击、筛选、表单与状态演示请进入交互原型。正式版不使用示例数据或固定价格。</p></div>`;state={...before};document.querySelector('[data-action="theme"]').onclick=()=>{state.dark=!state.dark;renderBoard()};}
let toastTimer;function toast(msg){$('#phone .toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=msg;$('#phone').append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3500)}
let focusBeforeSheet;function closeSheet(){const l=$('#phone .sheet-layer');l?.remove();focusBeforeSheet?.isConnected&&focusBeforeSheet.focus()}
function sheet(title,body){closeSheet();focusBeforeSheet=document.activeElement;const l=document.createElement('div');l.className='sheet-layer';l.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><button class="sheet-close" data-action="close" aria-label="关闭">×</button><h3 id="sheet-title">${title}</h3>${body}</section>`;$('#phone').append(l);l.addEventListener('click',e=>{if(e.target===l)closeSheet()});wire(l);l.querySelector('button,input')?.focus();l.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const nodes=[...l.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});}

function act(a){switch(a){case 'theme':state.dark=!state.dark;render();break;case 'close':closeSheet();break;case 'back':if(state.page==='edit')sheet('暂时不保存？','<p>你正在编辑的内容还没有保存。正式实现仅在内容有修改时显示此提示。</p><button class="primary" data-action="close">继续编辑</button><button class="link" style="width:100%" data-action="discard">放弃修改</button>');else nav(['backup','pro'].includes(state.page)?'mine':'home');break;case 'discard':nav(state.editExisting?'detail':'home');break;case 'add':sheet('存一张票证','<p>拍下来、选一张，或从空白开始。</p><div class="settings-group">'+setting('camera','拍照识别','打开相机，拍下收据或保修单','demo-camera')+setting('image','从相册选择','选择已有照片或电子收据','demo-camera')+setting('edit','手动填写','没有照片也可以记录','manual')+'</div>');break;case 'demo-camera':state.editExisting=false;state.scenario='normal';nav('edit');toast('示例识别结果；原型不访问相机或相册');break;case 'manual':state.editExisting=false;state.scenario='manual';nav('edit');break;case 'edit-existing':state.editExisting=true;state.scenario='normal';nav('edit');break;case 'soon':state.filter=tickets.some(t=>t.status==='soon')?'soon':'all';render();break;case 'clear':state.query='';state.filter='all';render();break;case 'filters':sheet('筛选票证',`<p>按保修状态，缩小查找范围。</p><div class="filters">${[['all','全部'],['active','未过期'],['expired','已过期'],['none','未设保修']].map(([v,l])=>`<button class="chip ${state.filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div><p>正式版同时保留购买日期 / 到期日期的范围筛选，详见实现任务书；此原型演示状态筛选。</p>`);break;case 'backup-gate':if(state.channel==='play'){nav('pro')}else{sheet('云备份需要 Pro','<p>当前国内渠道暂未开放购买。已有 Pro 权益用户可按实际权益进入；此原型可通过左侧设计目录预览备份页面。</p><button class="primary" data-action="close">知道了</button>')}break;case 'save':{const name=$('[name="merchant"]').value.trim(),amount=$('[name="amount"]').value.trim(),date=$('[name="purchase"]').value,end=$('[name="end"]').value,note=$('[name="note"]').value;if(amount&&!/^\d+(\.\d{1,2})?$/.test(amount)){$('#edit-error').textContent='金额请填写非负数字，最多两位小数。';return}if(!state.editExisting&&tickets.length>=10){if(state.channel==='play')nav('pro');else sheet('免费票证册已满','<p>已达到 10 张上限。已有票证仍可查看和编辑；当前渠道暂未开放会员购买。</p><button class="primary" data-action="close">返回继续编辑</button>');return}const days=end?Math.round((Date.parse(end+'T00:00:00Z')-Date.parse('2026-09-19T00:00:00Z'))/86400000):null,t={id:state.editExisting?state.selected:Date.now(),name,amount:amount?Number(amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'',date,end,note,hasImage:state.editExisting?selected().hasImage!==false:state.scenario!=='manual',days,status:days===null?'none':days<0?'expired':days<=30?'soon':'active'};if(state.editExisting)tickets=tickets.map(x=>x.id===t.id?t:x);else tickets.unshift(t);state.selected=t.id;state.scenario='normal';state.editExisting=false;nav('detail');toast('已保存到演示票证册 · 刷新会重置');break;}case 'detail-menu':sheet('票证操作',`<div class="settings-group">${setting('edit','编辑票证','','edit-existing')}${state.channel==='play'?setting('export','导出 PDF / 送修材料','','export'):''}${setting('ticket','删除这张票证','','delete-ticket')}</div>`);break;case 'delete-ticket':sheet('删除这张票证？','<p>本地记录将被删除，对应保修提醒也会取消。此操作无法撤销。</p><button class="primary" data-action="close">保留票证</button><button class="link danger" style="width:100%" data-action="confirm-delete">确认删除</button>');break;case 'confirm-delete':tickets=tickets.filter(t=>t.id!==state.selected);nav('home');toast('已删除演示票证');break;case 'manual-info':toast('手动录入不要求照片，可直接填写并保存');break;case 'image':sheet('原始凭证',`<p>这是示例票据。正式版使用已有长图查看器，支持完整查看、滚动与双指缩放。</p><div class="card" style="font-family:monospace;text-align:center;line-height:2.5"><h3>山姆会员商店</h3><small>销售凭证 / 示例</small><hr><p>飞利浦电动牙刷　1 件<br>实付　¥ 1,299.00<br>2025-09-26<br>请保留此购物凭证</p></div>`);break;case 'reocr':sheet('重新识别票据？','<p>正式实现需保留手动修改，或明确询问覆盖范围。不会静默覆盖已经确认的内容。</p><button class="primary" data-action="close">保留当前内容</button>');break;case 'reminders':sheet('保修到期提醒',`<p>提前 7 天、1 天和到期当天提醒你。送达时间可能受手机后台限制影响。</p><div class="success-note">${icon('bell')}通知${state.notified?'已开启':'尚未开启'}</
